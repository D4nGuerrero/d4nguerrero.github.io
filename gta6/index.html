    animation:drift 36s ease-in-out infinite alternate;
  }
  .veil{
    background:
      linear-gradient(180deg, rgba(7,8,16,.62) 0%, rgba(7,8,16,.18) 32%, rgba(13,12,26,.22) 58%, rgba(7,8,16,.78) 100%),
      radial-gradient(120% 80% at 50% 40%, transparent 40%, rgba(7,8,16,.45) 100%);
  }
  @keyframes drift{to{transform:scale(1.12)}}
  @media (prefers-reduced-motion:reduce){
    .bg{animation:none;transform:none}
    .live{animation:none!important}
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:flex-start;
    padding:max(1rem,env(safe-area-inset-top)) 1.25rem 0;
  }
  .mark{height:clamp(28px,5.5vw,44px);width:auto;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
  main{position:relative;z-index:2;padding:5.5rem 1.25rem 4.5rem;width:min(920px,100%)}
  .logo{
    width:min(430px,78vw);height:auto;display:block;margin:0 auto .9rem;
    filter:drop-shadow(0 10px 28px rgba(0,0,0,.55)) drop-shadow(0 0 42px rgba(233,99,199,.22));
  }
  .sub{
    font-family:'Cinzel',serif;font-weight:600;
    text-transform:uppercase;letter-spacing:.42em;
    font-size:clamp(.7rem,1.8vw,.92rem);
    color:#ffd7a8;margin:0 0 2.1rem;
    text-shadow:0 2px 16px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.7);
  }
  .timer{display:flex;gap:clamp(.65rem,2.4vw,1.6rem);justify-content:center;align-items:stretch;flex-wrap:wrap}
  .unit{
    min-width:clamp(92px,22vw,170px);
    padding:1rem .6rem 1.05rem;
    background:rgba(7,8,16,.42);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    position:relative;
  }
  .unit::after{
    content:"";position:absolute;left:18%;right:18%;bottom:0;height:2px;
    background:var(--sun);
    box-shadow:0 0 16px rgba(244,113,135,.45);
  }
  .num{
    font-family:'Oswald',sans-serif;font-weight:600;
    font-size:clamp(3rem,12vw,6.25rem);
    line-height:.9;font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
    text-shadow:0 4px 24px rgba(0,0,0,.55);
  }
  .lbl{
    font-family:'Cinzel',serif;font-weight:600;
    font-size:clamp(.58rem,1.6vw,.72rem);
    letter-spacing:.32em;text-transform:uppercase;
    color:var(--pink);opacity:.92;margin-top:.7rem;
  }
  .when{
    margin-top:1.85rem;
    font-weight:400;letter-spacing:.16em;text-transform:uppercase;
    font-size:clamp(.68rem,2vw,.9rem);
    color:rgba(255,255,255,.82);
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }
  .done .timer,.done .sub{display:none}
  .live{display:none}
  .done .live{
    display:block;
    font-family:'Oswald',sans-serif;font-weight:700;
    font-size:clamp(2.2rem,9vw,5.4rem);
    letter-spacing:.06em;line-height:1;
    background:var(--sun);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(244,113,135,.55));
    animation:pulse 1.4s ease-in-out infinite;
    margin:.4rem 0 .4rem;
  }
  @keyframes pulse{50%{transform:scale(1.045)}}
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:3;
    padding:0 1rem max(.7rem,env(safe-area-inset-bottom));
    font-size:.62rem;letter-spacing:.08em;
    color:rgba(255,255,255,.45);text-transform:uppercase;
  }
  @media (max-width:520px){
    .unit{min-width:28vw;padding:.75rem .35rem .9rem}
    .sub{letter-spacing:.28em}
    .lbl{letter-spacing:.18em}
    .when{letter-spacing:.08em}
  }
  @media (max-height:700px){
    .logo{width:min(300px,62vw)}
    .sub{margin-bottom:1.15rem}
    main{padding:4.4rem 1rem 3.2rem}
  }
</style>
</head>
